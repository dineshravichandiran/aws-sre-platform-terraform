name: terraform

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tftest.hcl"
      - ".tflint.hcl"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. Never cancel a run that may be applying infrastructure.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.12.2"
  CHECKOV_VERSION: "3.4.3"
  # Set these as repository variables (Settings > Secrets and variables > Actions > Variables).
  # They are IDs, not secrets: access works through OIDC, there are no AWS keys in this repo.
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  # ------------------------------------------------------------------------
  # No AWS account needed. This is what keeps the badge green for everyone.
  # ------------------------------------------------------------------------
  static:
    name: format, validate, lint, test, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate every module and stack
        run: |
          for dir in modules/* envs/dev bootstrap; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: Tests (mocked provider, no credentials)
        run: |
          for dir in modules/* envs/dev; do
            echo "::group::test $dir"
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.1

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config="$GITHUB_WORKSPACE/.tflint.hcl" --minimum-failure-severity=warning

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: checkov (security scan)
        run: |
          pip install --quiet "checkov==${CHECKOV_VERSION}"
          checkov -d . --framework terraform --skip-path '.terraform' --compact --quiet

  # ------------------------------------------------------------------------
  # Plan on every pull request. Needs the AWS_PLAN_ROLE_ARN variable; skipped without it.
  # ------------------------------------------------------------------------
  plan:
    name: plan (dev)
    needs: static
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job ask GitHub for an OIDC token
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Sign in to AWS with OIDC (read-only role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -input=false -lock-timeout=60s -no-color -out=tfplan | tee plan.txt

      - name: Comment the plan on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            let plan = fs.readFileSync('envs/dev/plan.txt', 'utf8');
            const limit = 60000;
            if (plan.length > limit) plan = plan.slice(0, limit) + '\n... plan truncated, see the job log ...';
            const body = `${marker}\n### Terraform plan (dev)\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # ------------------------------------------------------------------------
  # Apply on merge to main. Runs in the "dev" GitHub environment: add a required
  # reviewer there and a human approves every apply. Needs AWS_APPLY_ROLE_ARN.
  # ------------------------------------------------------------------------
  apply:
    name: apply (dev)
    needs: static
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_APPLY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Sign in to AWS with OIDC (apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=envs/dev/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -input=false -lock-timeout=60s -no-color -out=tfplan

      # The saved plan is applied as-is: what was planned is exactly what runs.
      - name: Apply
        run: terraform apply -input=false -lock-timeout=60s -no-color tfplan

      - name: Outputs
        run: terraform output
